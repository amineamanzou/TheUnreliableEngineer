name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_stream(File.read(path)); puts "ok #{path}" }'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Dependency release age gate
        run: npm run check:dependencies-age

      - name: Install dependencies
        run: npm ci

      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Astro check
        run: npm run check

      - name: I18n content check
        run: npm run check:i18n

      - name: Build
        run: npm run build
        env:
          SITE_URL: "https://theunreliable.engineer"
          BASE_PATH: "/"

      - name: Verify browser observability is off by default
        run: npm run check:browser-observability -- --mode=off

      - name: Verify product analytics is off by default
        run: npm run check:product-analytics -- --mode=off

      - name: Review static site
        run: npm run review:static

      - name: Build Browser RUM contract
        run: npm run build
        env:
          SITE_URL: "https://theunreliable.engineer"
          BASE_PATH: "/"
          PUBLIC_BROWSER_OBSERVABILITY_ENABLED: "true"
          PUBLIC_BROWSER_OBSERVABILITY_URL: "https://otel.theunreliable.engineer.test"
          PUBLIC_BROWSER_OBSERVABILITY_API_KEY: "browser-public"
          PUBLIC_BROWSER_SERVICE_NAME: "the-unreliable-engineer-frontend"
          PUBLIC_BROWSER_SERVICE_VERSION: ${{ github.sha }}
          PUBLIC_BROWSER_SITE_NAME: "theunreliable.engineer"
          PUBLIC_DEPLOYMENT_ENVIRONMENT: "production"

      - name: Verify Browser RUM contract
        run: npm run check:browser-observability -- --mode=on

      - name: Review enabled Browser RUM test build
        run: npm run review:static

      - name: Browser RUM payload and consent smoke
        env:
          BROWSER_OBSERVABILITY_OTLP_URL: "https://otel.theunreliable.engineer.test"
          CHROME_PATH: "/usr/bin/google-chrome"
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/the-unreliable-engineer-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4321/ > /dev/null
          npm run review:observability -- http://127.0.0.1:4321/
          npm run review:legal -- http://127.0.0.1:4321/ --require=rum

      - name: Build product analytics contract
        env:
          SITE_URL: "https://theunreliable.engineer"
          BASE_PATH: "/"
          PUBLIC_PRODUCT_ANALYTICS_ENABLED: "true"
          PUBLIC_POSTHOG_KEY: phc_0123456789abcdefghijklmnopqrstuvwxyzABCD
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          PUBLIC_ANALYTICS_SITE_NAME: theunreliable.engineer
          PUBLIC_SERVICE_VERSION: ${{ github.sha }}
          PUBLIC_DEPLOYMENT_ENVIRONMENT: production
        run: npm run build

      - name: Verify product analytics enabled contract
        run: npm run check:product-analytics -- --mode=on

      - name: Exercise product analytics consent and privacy contract
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PRODUCT_ANALYTICS_QA_URL: http://127.0.0.1:4321/
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/the-unreliable-engineer-product-analytics-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/the-unreliable-engineer-product-analytics-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run review:product-analytics
          npm run review:legal -- http://127.0.0.1:4321/ --require=analytics

      - name: Build combined consent contract
        env:
          SITE_URL: "https://theunreliable.engineer"
          BASE_PATH: "/"
          PUBLIC_BROWSER_OBSERVABILITY_ENABLED: "true"
          PUBLIC_BROWSER_OBSERVABILITY_URL: "https://otel.theunreliable.engineer.test"
          PUBLIC_BROWSER_OBSERVABILITY_API_KEY: "browser-public"
          PUBLIC_BROWSER_SERVICE_NAME: "the-unreliable-engineer-frontend"
          PUBLIC_BROWSER_SERVICE_VERSION: ${{ github.sha }}
          PUBLIC_BROWSER_SITE_NAME: "theunreliable.engineer"
          PUBLIC_PRODUCT_ANALYTICS_ENABLED: "true"
          PUBLIC_POSTHOG_KEY: phc_0123456789abcdefghijklmnopqrstuvwxyzABCD
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
          PUBLIC_ANALYTICS_SITE_NAME: theunreliable.engineer
          PUBLIC_SERVICE_VERSION: ${{ github.sha }}
          PUBLIC_DEPLOYMENT_ENVIRONMENT: production
        run: |
          npm run build
          npm run check:browser-observability -- --mode=on
          npm run check:product-analytics -- --mode=on

      - name: Exercise combined consent sequencing
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PRODUCT_ANALYTICS_QA_URL: http://127.0.0.1:4321/
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/the-unreliable-engineer-combined-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/the-unreliable-engineer-combined-preview.log
              exit 1
            fi
            sleep 1
          done
          npm run review:product-analytics
          npm run review:legal -- http://127.0.0.1:4321/ --require=both

      - name: SEO output check
        run: npm run check:seo
