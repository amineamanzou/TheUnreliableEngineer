<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rayon d'impact d'une petite dépendance</title>
  <desc id="desc">Un petit composant rouge propage une panne à travers plusieurs couches de services jusqu'aux utilisateurs.</desc>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3e3234" opacity=".4"/></pattern><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d82323"/></marker></defs>
  <rect width="1600" height="900" fill="#101010"/><rect width="1600" height="900" fill="url(#g)"/>
  <g fill="none" stroke="#d82323" stroke-width="6" marker-end="url(#a)"><path d="M310 450C470 450 470 240 640 240"/><path d="M310 450C470 450 470 450 640 450"/><path d="M310 450C470 450 470 660 640 660"/><path d="M820 240C1010 240 990 340 1170 340"/><path d="M820 450C1010 450 990 450 1170 450"/><path d="M820 660C1010 660 990 560 1170 560"/></g>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle"><g transform="translate(130 350)"><rect width="180" height="200" rx="12" fill="#7f1212" stroke="#ffd33d" stroke-width="4"/><rect x="56" y="54" width="68" height="68" fill="#ffd33d"/><path d="M68 88h44M90 66v44" stroke="#101010" stroke-width="8"/><text x="90" y="164" fill="#fff7e8" font-size="24">DÉPENDANCE</text></g>
  <g fill="#191919" stroke="#fff7e8" stroke-width="3"><rect x="640" y="165" width="180" height="150" rx="10"/><rect x="640" y="375" width="180" height="150" rx="10"/><rect x="640" y="585" width="180" height="150" rx="10"/><rect x="1170" y="265" width="260" height="150" rx="10"/><rect x="1170" y="375" width="260" height="150" rx="10"/><rect x="1170" y="485" width="260" height="150" rx="10"/></g>
  <g fill="#fff7e8" font-size="28"><text x="730" y="252">SERVICE A</text><text x="730" y="462">SERVICE B</text><text x="730" y="672">SERVICE C</text><text x="1300" y="352">PARCOURS</text><text x="1300" y="462">ÉQUIPE</text><text x="1300" y="572">UTILISATEURS</text></g></g>
  <text x="110" y="126" fill="#fff7e8" font-family="Arial Black, Arial, sans-serif" font-size="62">PETITE PIÈCE. GRAND RAYON.</text><text x="112" y="186" fill="#d0c4b2" font-family="Arial, sans-serif" font-size="28">La criticité vient du graphe de dépendances, pas de la taille du paquet.</text>
</svg>
