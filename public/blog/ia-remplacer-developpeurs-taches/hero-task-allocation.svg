<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Répartir les tâches entre humain et IA</title><desc id="desc">Une matrice distingue les tâches à automatiser, assister, superviser ou garder sous jugement humain.</desc>
  <rect width="1600" height="900" fill="#101010"/>
  <g transform="translate(150 230)"><rect width="1300" height="540" fill="#191919" stroke="#3e3234" stroke-width="3"/><path d="M325 0v540M650 0v540M975 0v540" stroke="#3e3234" stroke-width="3"/>
    <g font-family="Arial Black, Arial, sans-serif" font-size="34" text-anchor="middle"><text x="162" y="74" fill="#fff7e8">AUTOMATISER</text><text x="487" y="74" fill="#fff7e8">ASSISTER</text><text x="812" y="74" fill="#fff7e8">SUPERVISER</text><text x="1137" y="74" fill="#fff7e8">JUGER</text></g>
    <g fill="none" stroke-width="16"><path d="M92 270l52 52 100-122" stroke="#ffd33d"/><path d="M414 230h146M487 157v146" stroke="#d82323"/><circle cx="812" cy="250" r="78" stroke="#fff7e8"/><path d="M868 306l68 68" stroke="#fff7e8"/><path d="M1067 322c92-170 184-170 276 0" stroke="#ffd33d"/><circle cx="1130" cy="224" r="18" fill="#ffd33d" stroke="none"/><circle cx="1280" cy="224" r="18" fill="#ffd33d" stroke="none"/></g>
    <g font-family="Arial, sans-serif" font-size="26" fill="#d0c4b2" text-anchor="middle"><text x="162" y="460">Répétable</text><text x="487" y="460">Brouillon</text><text x="812" y="460">Vérification</text><text x="1137" y="460">Responsabilité</text></g>
  </g>
  <text x="110" y="126" fill="#fff7e8" font-family="Arial Black, Arial, sans-serif" font-size="62">LA BONNE QUESTION EST UNE TÂCHE</text><text x="112" y="186" fill="#d0c4b2" font-family="Arial, sans-serif" font-size="28">Capacité technique, coût de l'erreur et responsabilité ne se remplacent pas en bloc.</text>
</svg>
