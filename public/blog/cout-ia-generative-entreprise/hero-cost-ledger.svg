<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Le coût total de l'IA générative en entreprise</title>
  <desc id="desc">Un registre relie la requête initiale aux coûts de modèle, d'intégration, de revue, d'infrastructure et de risque.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#3e3234" stroke-width="1" opacity=".45"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffd33d"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#101010"/><rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M145 450H1425" stroke="#ffd33d" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" font-weight="700" fill="#fff7e8" text-anchor="middle">
    <g transform="translate(170 330)"><rect width="220" height="240" rx="10" fill="#191919" stroke="#fff7e8" stroke-width="3"/><path d="M0 26h220" stroke="#d82323" stroke-width="12"/><text x="110" y="92" font-size="30">DEMANDE</text><path d="M72 132h76M72 160h76M72 188h46" stroke="#8e9297" stroke-width="8"/></g>
    <g transform="translate(450 330)"><rect width="220" height="240" rx="10" fill="#191919" stroke="#b91818" stroke-width="3"/><circle cx="110" cy="145" r="60" fill="none" stroke="#d82323" stroke-width="16"/><path d="M110 85v120M50 145h120" stroke="#fff7e8" stroke-width="8"/><text x="110" y="58" font-size="28">MODÈLE</text></g>
    <g transform="translate(730 330)"><rect width="220" height="240" rx="10" fill="#191919" stroke="#b91818" stroke-width="3"/><path d="M62 178l48-78 48 78M82 178h56" fill="none" stroke="#fff7e8" stroke-width="12"/><text x="110" y="58" font-size="28">INTÉGRATION</text></g>
    <g transform="translate(1010 330)"><rect width="220" height="240" rx="10" fill="#191919" stroke="#b91818" stroke-width="3"/><path d="M68 145l28 28 62-72" fill="none" stroke="#ffd33d" stroke-width="14"/><text x="110" y="58" font-size="28">REVUE</text></g>
    <g transform="translate(1290 330)"><rect width="220" height="240" rx="10" fill="#7f1212" stroke="#ffd33d" stroke-width="3"/><path d="M110 92l64 112H46z" fill="none" stroke="#ffd33d" stroke-width="12"/><circle cx="110" cy="172" r="7" fill="#ffd33d"/><text x="110" y="58" font-size="28">RISQUE</text></g>
  </g>
  <text x="110" y="126" fill="#fff7e8" font-family="Arial Black, Arial, sans-serif" font-size="62">LE PRIX N'EST PAS LA FACTURE</text>
  <text x="112" y="186" fill="#d0c4b2" font-family="Arial, sans-serif" font-size="28">Chaque étape ajoute un coût visible, humain ou opérationnel.</text>
</svg>
