<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Projet en dérive sous des indicateurs verts</title><desc id="desc">Une ligne de livraison réelle descend tandis que cinq voyants de statut restent verts.</desc>
  <defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#d82323"/></marker></defs>
  <rect width="1600" height="900" fill="#101010"/><g transform="translate(120 240)"><rect width="1360" height="520" fill="#191919" stroke="#3e3234" stroke-width="3"/><g stroke="#3e3234"><path d="M0 104h1360M0 208h1360M0 312h1360M0 416h1360"/><path d="M272 0v520M544 0v520M816 0v520M1088 0v520"/></g>
  <g fill="#3bd671" stroke="#fff7e8" stroke-width="4"><circle cx="136" cy="90" r="30"/><circle cx="408" cy="90" r="30"/><circle cx="680" cy="90" r="30"/><circle cx="952" cy="90" r="30"/><circle cx="1224" cy="90" r="30"/></g><g fill="#fff7e8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle"><text x="136" y="155">STATUT</text><text x="408" y="155">BUDGET</text><text x="680" y="155">PLANNING</text><text x="952" y="155">QUALITÉ</text><text x="1224" y="155">RISQUE</text></g>
  <path d="M80 240C360 250 490 258 650 330S1050 420 1280 480" fill="none" stroke="#d82323" stroke-width="14" marker-end="url(#r)"/><path d="M80 236h520" stroke="#ffd33d" stroke-width="4" stroke-dasharray="14 14"/><text x="1140" y="438" fill="#ffd33d" font-family="Arial Black, Arial, sans-serif" font-size="30">RÉALITÉ</text></g>
  <text x="110" y="126" fill="#fff7e8" font-family="Arial Black, Arial, sans-serif" font-size="62">TOUT EST VERT. LE PROJET DÉRIVE.</text><text x="112" y="186" fill="#d0c4b2" font-family="Arial, sans-serif" font-size="28">Les indicateurs de conformité peuvent rester stables pendant que les décisions s'éloignent du résultat.</text>
</svg>
