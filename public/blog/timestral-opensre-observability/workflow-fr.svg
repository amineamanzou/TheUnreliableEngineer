<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Le workflow quotidien de Timestral et OpenSRE</title>
<desc id="desc">Les applications envoient leur télémétrie au ClickHouse existant. Timestral analyse les métriques chaque jour et produit des signaux candidats. Le workflow lance chaque jour une investigation consolidée avec OpenSRE, alimentée par ces signaux, la topologie, les runbooks et des outils bornés en lecture seule. OpenSRE remet un rapport ; les décisions, corrections et déploiements restent humains.</desc>
