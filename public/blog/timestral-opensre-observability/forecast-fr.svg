<text x="124" y="715" font-size="25" font-weight="400" text-anchor="start" fill="#171714">Mesures réelles</text>
<path d="M389 706 L427 706" fill="none" stroke="#171714" stroke-width="2.5"/>
<text x="440" y="715" font-size="25" font-weight="400" text-anchor="start" fill="#171714">Borne haute q99</text>
<rect x="45" y="757" width="640" height="198" rx="18" fill="#171714"/>
<rect x="40" y="752" width="640" height="198" rx="18" fill="#fffef8" stroke="#171714" stroke-width="3.5"/>
<text x="68" y="794" font-size="31" font-weight="700" text-anchor="start" fill="#171714">Un signal candidat</text>
<text x="68" y="836" font-size="27" font-weight="400" text-anchor="start" fill="#171714">3 dépassements significatifs</text>
<text x="68" y="871" font-size="27" font-weight="400" text-anchor="start" fill="#171714">sur 3 tranches de 5 minutes.</text>
<text x="68" y="918" font-size="27" font-weight="700" text-anchor="start" fill="#c9342d">Un incident reste à qualifier.</text>
<text x="360" y="999" font-size="25" font-weight="400" text-anchor="middle" fill="#171714">q99 décrit la distribution prévue.</text>
<text x="360" y="1033" font-size="25" font-weight="400" text-anchor="middle" fill="#171714">Ce n’est pas une certitude à 99 %.</text>
</g></svg>
