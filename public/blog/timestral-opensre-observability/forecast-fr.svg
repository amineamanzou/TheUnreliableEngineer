<path d="M64 540 L666 540" fill="none" stroke="#ddd5c7" stroke-width="1.6"/>
<path d="M64 553 L666 553" fill="none" stroke="#171714" stroke-width="3"/>
<path d="M296 238 L296 553" fill="none" stroke="#59574f" stroke-width="2.5" stroke-dasharray="7 8"/>
<text x="296" y="592" font-size="27" font-weight="700" text-anchor="middle" fill="#171714">t₀</text>
<text x="410" y="592" font-size="25" font-weight="400" text-anchor="middle" fill="#171714">+10</text>
<text x="530" y="592" font-size="25" font-weight="400" text-anchor="middle" fill="#171714">+20</text>
<text x="650" y="592" font-size="25" font-weight="400" text-anchor="middle" fill="#171714">+30</text>
<text x="664" y="627" font-size="25" font-weight="400" text-anchor="end" fill="#59574f">min</text>
<path d="M350 553 L350 560" fill="none" stroke="#171714" stroke-width="2"/>
