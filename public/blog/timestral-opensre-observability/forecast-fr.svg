<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Comparer six points prévus aux mesures réelles</title>
<desc id="desc">Données illustratives, sans mesure issue de l’expérimentation. L’historique antérieur à t0 sert de contexte. La fenêtre suivante comporte six points espacés de cinq minutes, soit trente minutes. La médiane prévue et une bande de quantiles sont comparées aux mesures. Trois mesures consécutives dépassent la borne haute q99. Un dépassement significatif sur trois tranches de cinq minutes constitue un signal candidat, pas la preuve d’un incident ni une certitude à 99 pour cent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#171714"/></marker></defs>
<rect width="720" height="1060" fill="#fff9ed"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#171714" stroke-linecap="round" stroke-linejoin="round">
<path d="M40 39 L40 91" stroke="#c9342d" stroke-width="9"/>
<text x="60" y="58" font-size="34" font-weight="700" text-anchor="start" fill="#171714">Prévoir, puis comparer</text>
<text x="60" y="96" font-size="25" font-weight="400" text-anchor="start" fill="#59574f">6 points × 5 minutes = 30 minutes</text>
<rect x="40" y="123" width="640" height="49" rx="12" fill="#ffe17d" stroke="#171714" stroke-width="3.5"/>
<text x="360" y="157" font-size="27" font-weight="700" text-anchor="middle" fill="#171714">Données illustratives</text>
