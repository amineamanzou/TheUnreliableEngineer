<path d="M470 553 L470 560" fill="none" stroke="#171714" stroke-width="2"/>
<path d="M530 553 L530 560" fill="none" stroke="#171714" stroke-width="2"/>
<path d="M590 553 L590 560" fill="none" stroke="#171714" stroke-width="2"/>
<path d="M650 553 L650 560" fill="none" stroke="#171714" stroke-width="2"/>
<polygon points="296,369 350,365 410,374 470,359 530,368 590,361 650,372 650,507 590,494 530,501 470,495 410,503 350,491 296,493" fill="#ffe17d"/>
