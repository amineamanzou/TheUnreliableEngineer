<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">The daily Timestral and OpenSRE workflow</title>
<desc id="desc">Applications send telemetry to the existing ClickHouse. Timestral analyses metrics daily and produces candidate signals. The workflow starts a consolidated OpenSRE investigation every day, supplied with those signals, topology, runbooks and bounded read-only tools. OpenSRE produces a report; decisions, corrections and deployments remain with the human.</desc>
