<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1240" viewBox="0 0 720 1240" role="img" aria-labelledby="title desc" xml:lang="fr">
<title id="title">Media Review : suivre les preuves, garder les hypothèses ouvertes</title>
<desc id="desc">Un job en échec reste stable, les files suivies sont vides et des opérations réussissent : l’enquête s’oriente vers un échec déjà enregistré. Sur la même période, quinze erreurs de base de données, quinze transactions en erreur et quinze prévisualisations échouées peuvent concerner les mêmes opérations ; ces catégories ne doivent pas être additionnées. La prochaine vérification consiste à retrouver les traces des échecs et comparer avec une opération réussie. Le rapport reste borné aux éléments lus et conserve les hypothèses ouvertes. Les décisions sont humaines. L’enquête travaille en lecture seule, avec vingt-quatre appels d’outils et quinze minutes au maximum.</desc>
